# Erzeugt assets/css/styles.css automatisch neu, wenn HTML, JS oder das Design geändert werden.
name: CSS bauen

on:
  push:
    branches: [main]
    paths: ['*.html', 'en/**', 'assets/js/**', 'src/**', 'tailwind.config.js', 'package.json']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: npm run build
      - name: Geändertes Stylesheet committen
        run: |
          if git diff --quiet -- assets/css/styles.css; then
            echo "Stylesheet ist aktuell."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
            git add assets/css/styles.css
            git commit -m "CSS automatisch neu gebaut"
            git push
          fi
